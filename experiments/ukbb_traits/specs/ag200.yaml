# AlphaGenome variant effects alone: 200 components of the standardized tracks. Without
# standardizing, RNA-seq is 0.65% of the variance; 200 components reach ~95% of it (HM3+).
blocks:
  - provider: precomputed
    path: alphagenome.tsv.gz
    name: alphagenome
    orient: effect
    standardize: true
    pca: 200
